- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  abstract: true
  id: ShipMiningDrillBase
  components:
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: WiresVisuals
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WiresPanel
  - type: Transform
    anchored: true
  - type: Pullable
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: NodeContainer
    nodes:
      storage:
        !type:StorageDeviceNode
        nodeGroupID: Storage

- type: entity
  parent: ShipMiningDrillBase
  id: ShipMiningDrill
  name: large mining drill
  description: Carves through asteroids.
  components:
  - type: Sprite
    sprite: _Cataclysm/Structures/Machines/Production/ship_drill_basic.rsi
    snapCardinals: true
    layers:
    - state: icon